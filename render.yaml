services:
  - type: web
    name: railsmart-backend
    env: node
    region: singapore
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        value: railsmart_super_secure_jwt_secret_key_2026
      - key: MONGO_URI
        sync: false
